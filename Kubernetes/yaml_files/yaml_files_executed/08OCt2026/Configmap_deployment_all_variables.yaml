apiVersion: v1
kind: ConfigMap
metadata:
  name: my-configmap1
data:
  Runway: IGL85R
  Pre-Prod: IGL82N
  Staging: IGL84R
  Production: IGL80P
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    type: frontend-deployment
    client: Durga
spec:
  replicas: 2
  selector:
    matchLabels:
      type: frontend-deployment
      client: Durga
  template:
    metadata:
      labels:
        type: frontend-deployment
        client: Durga
    spec:
      containers:
        - name: deployment-cont
          image: ubuntu:latest
          command: ["sleep", "infinity"]
          envFrom:
            - configMapRef:
                name: my-configmap1
