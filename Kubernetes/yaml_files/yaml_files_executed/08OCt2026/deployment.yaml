apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    type: frontend-deployment
    client: YND
spec:
  replicas: 2
  selector:
    matchLabels:
      type: frontend-deployment 
      client: YND
  template:
    metadata:
      labels:
        type: frontend-deployment
        client: YND
    spec:
      containers:
        - name: deployment-cont
          image: ubuntu:latest
          command: ["sleep", "infinity"]

