apiVersion: apps/v1
kind: Deployment 
metadata:
  name: my-deployment-clusterip-service
  labels:
    type: clusterip-service-frontend
    client: durga
spec:
  replicas: 2
  selector: 
    matchLabels:
      type: clusterip-service-frontend
      client: durga
  template:
    metadata:
      labels:
        type: clusterip-service-frontend
        client: durga
    spec:
      containers:
        - name: clusterip-service-cont
          image: nginx:latest
---
apiVersion: v1
kind: Service
metadata:
  name: my-cluser-ip-service
  labels:
    type: clusterip-service-rontend
    client: durga
spec:
  type: ClusterIP
  selector:
    type: clusterip-service-frontend
    client: durga
  ports:
    - port: 80
