apiVersion: apps/v1
kind: ReplicaSet
metadata: 
  name: my-replicasset-1
  labels:
    type: frontend-replicaset
    client: rao
spec:
  replicas: 2
  selector:
    matchLabels:
      type: frontend-replicaset
      client: rao
  template:
    metadata:
      labels:
        type: frontend-replicaset
        client: rao
    spec: 
      containers:
        - name: replicaset-cont
          image: ubuntu:latest
          command: ["sleep", "infinity"]
